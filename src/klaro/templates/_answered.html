{% for question in record.questions %}
<section class="kl-answer" aria-labelledby="answered-{{ question.id }}">
  <h3 class="kl-answer__question" id="answered-{{ question.id }}">{{ loop.index }}. {{ question.name }}</h3>
  <ul class="uk-list">
    {% for value in record.answers.get(question.id, []) %}<li><svg class="kl-answer__tick" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>{{ value }}</span></li>{% endfor %}
  </ul>
</section>
{% endfor %}
