[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "klaro"
version = "0.1.0"
description = "Pushover questionnaires with structured answer back-channel"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Thorsten Kramm" }]
dependencies = [
  "Flask>=3.1,<4",
  "Jinja2>=3.1,<4",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "gunicorn>=23,<27",
  "gevent>=24,<27",
  "packaging>=24,<27",
]

[project.scripts]
klaro = "klaro.cli:main"

[dependency-groups]
dev = [
  "beautifulsoup4>=4.13,<5",
  "playwright>=1.50,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
klaro = [
  "py.typed",
  "templates/*.html",
  "static/vendor/uikit/*",
  "static/vendor/htmx/*",
  "static/klaro/*",
  "THIRD_PARTY_NOTICES.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
